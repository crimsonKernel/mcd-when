name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署到 GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 三页版: index(问答) / rank(全国榜单) / how(方法与合规) +
      # 共享数据 mcd-data.js + 单文件离线版 report.html(导航里可下载)。
      # 根路径直接就是问答页, 评委不必猜文件名。
      - name: 整理站点目录
        run: |
          mkdir -p _site
          cp dist/index.html dist/rank.html dist/how.html _site/
          cp dist/mcd-data.js dist/report.html dist/card.html _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
