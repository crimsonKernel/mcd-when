name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署到 GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # dist/report.html 是自包含单文件; 另存一份为 index.html,
      # 这样 https://<user>.github.io/mcd-when/ 根路径直接就是问答页,
      # 评委不必猜文件名。
      - name: 整理站点目录
        run: |
          mkdir -p _site
          cp dist/report.html _site/index.html
          cp dist/card.html _site/card.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
